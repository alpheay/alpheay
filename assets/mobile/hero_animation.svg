<text x="40" y="47" fill="#aaa9a6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="2">01 / THE THROUGHLINE</text><text x="40" y="111" fill="#f4f3ef" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="400" letter-spacing="-1.5">Research deeply.</text><text x="40" y="164" fill="#f4f3ef" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="400" letter-spacing="-1.5">Build deliberately.</text><path d="M40 197L600 197" stroke="#303030" stroke-width="1" /><text x="40" y="243" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" >From agent orchestration to the</text><text x="40" y="280" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" >interfaces people use. I care about</text><text x="40" y="317" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" >the whole system.</text>
